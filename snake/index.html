<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cobrinha Fofinha</h1>
    <p class="controls">Setas / WASD para mover • Espaço para pausar • R para reiniciar</p>
    <div class="HUD">
        <span>Pontos: <strong id="score">0</strong></span>
        <span>Recorde: <strong id="snake-best">0</strong></span>
        <span>Estado: <strong id="state">PRONTO</strong></span>
    </div>
    <canvas id="game" width="480" height="360"></canvas>
    <p>Coma as maçãs • Evite os obstáculos • Não bata em si mesma </p>
    <script src="script.js"></script>
</body>
</html>
